# Docker configuration for testing Scitacean against local services.
# This template is processed by `scitacean.testing._services.config.configure_services`
# before it can be used by docker compose.
#
# The images are based on the CI setup of the SciCat backend
# and a released package of the version configured in pyproject.toml:
# https://github.com/SciCatProject/scicat-backend-next/pkgs/container/backend-next/versions
#
# See https://scicatproject.github.io/documentation/Development/v4.x/backend/configuration.html
# for a list of all env variables.

services:
  network:
    image: alpine:3
    command: sleep 2147483647
    init: true
    ports:
      - ${SFTP_PORT}:${SFTP_PORT}
      - ${SCICAT_PORT}:${SCICAT_PORT}
      # Keycloak always listens on 8080
      - 8080:${KEYCLOAK_PORT}
    healthcheck:
      test:
        - 'CMD'
        - 'true'
      interval: 1s
      timeout: 2s
      retries: 10
      start_period: 1s

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.0
    command: start-dev --import-realm
    network_mode: "service:network"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin  # betterleaks:allow
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      # The image has no curl/wget, so use bash's /dev/tcp
      test:
        - CMD-SHELL
        - 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "UP" <&3'
      interval: 1s
      timeout: 2s
      retries: 90
      start_period: 2s
    volumes:
      - ${KEYCLOACK_REALM_IMPORT_DIR}:/opt/keycloak/data/import

  mongodb:
    image: mongo:latest
    network_mode: "service:network"

  scicat:
    image: ghcr.io/scicatproject/backend-next:v5.3.2
    network_mode: "service:network"
    depends_on:
      mongodb:
        condition: service_started
      keycloak:
        condition: service_healthy
    restart: on-failure
    environment:
      DOI_PREFIX: DOI.SAMPLE.PREFIX
      ELASTICSEARCH_ENABLED: no
      HTTP_MAX_REDIRECTS: 1  # Scitacean should not require redirects
      HTTP_TIMEOUT: 5000  # in ms
      JWT_EXPIRES_IN: 3600  # in s (expiry of token)
      JWT_SECRET: a_scicat_secret
      LOGBOOK_ENABLED: no  # we don't test these endpoints
      MONGODB_URI: mongodb://localhost:27017/scicat
      PID_PREFIX: PID.prefix.a0b1
      PORT: ${SCICAT_PORT}
      SITE: SCITACEAN
      OIDC_ISSUER: "http://localhost:${KEYCLOAK_PORT}/realms/scitacean"
      OIDC_AUTHORIZATION_URL: "http://localhost:${KEYCLOAK_PORT}/realms/scitacean"
      OIDC_CLIENT_ID: "scicat"
      OIDC_CLIENT_SECRET: "1FqGvrewZg1L08fEfarp5GzLVZOZGrib"  # betterleaks:allow
      OIDC_CALLBACK_URL: "http://localhost:${SCICAT_PORT}/api/v3/auth/oidc/callback"
      OIDC_SCOPE: 'openid profile email'
      OIDC_SUCCESS_URL: "http://localhost:4200/auth-callback"
      OIDC_ACCESS_GROUPS: "accessgroups"
      OIDC_ADDITIONAL_AUTHORIZED_PARTIES: "scitacean-test"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O- http://localhost:${SCICAT_PORT}/api/v3/health || exit 1" ]
      interval: 1s
      timeout: 2s
      retries: 90
      start_period: 2s
    volumes:
      - ${SCICAT_ACCOUNT_CONFIG_PATH}:/home/node/app/functionalAccounts.json

  sftp:
    build:
      context: .
      dockerfile: Dockerfile-sftp-server
    network_mode: "service:network"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=CET  # Not UTC on purpose to test timezone detection
      # The directory contains _only_ the public key shipped with Scitacean.
      - PUBLIC_KEY_DIR=/pubkeys
      - SUDO_ACCESS=false
      - PASSWORD_ACCESS=true
      - USER_NAME=the-scitacean
      - USER_PASSWORD=sup3r-str0ng
    volumes:
      - ${SFTP_DATA_DIR}:/data
      - ${SFTP_SEED_DIR}:/data/seed
      - ${SSH_PUBKEY_DIR}:/pubkeys:ro
    restart: unless-stopped
    healthcheck:
      # Performs an SSH handshake, so it only passes once sshd accepts connections.
      test:
        - CMD-SHELL
        - 'ssh-keyscan -T 2 -t ed25519 -p ${SFTP_PORT} 127.0.0.1 2>/dev/null | grep -q ssh-ed25519'
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 1s
