[build-system]
requires = [
    "setuptools>=77",
    "setuptools_scm[toml]>=8.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "scitacean"
description = "High-level interface for SciCat"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Scitacean contributors" }]
dynamic = ["version"]
readme = "README.md"
keywords = ["scicat"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "email-validator >= 2",
    "httpx >= 0.24",
    "pydantic >= 2",
]

[project.optional-dependencies]
sftp = ["paramiko >= 3"]
test = [
    "filelock >= 3",
    "hypothesis >= 6.48",
    "pyyaml >= 5"
]

[dependency-groups]
build = ["build"]
dev = [
    { include-group = "docs" },
    { include-group = "test" },
    "jinja2 >= 3.1",
    "jupyterlab >= 4.4.5",
    "mypy >= 1.17",
    "pytest-sugar >= 1.0",
    "types-docutils >= 0.21",
    "types-paramiko >= 3.5",
    "types-PyYAML >= 6.0",
]
docs = [
    { include-group = "test" }, # Docs import from testing package
    "autodoc_pydantic >= 2.2",
    "ipykernel >= 6.30",
    "ipython >= 9.0",
    "myst-parser >= 4.0",
    "nbsphinx >= 0.9.7",
    "pydata-sphinx-theme >= 0.16",
    "sphinx >= 8.1, < 9.0.0",
    "sphinx-autodoc-typehints >= 3.0",
    "sphinx-copybutton >= 0.5.2",
    "sphinx-design >= 0.6.1",
]
test = [
    "filelock >= 3",
    "paramiko >= 3",
    "hypothesis >= 6.48",
    "pyfakefs >= 5",
    "pytest >= 7",
    "pytest-randomly >= 3",
    "pytest-socket >= 0.7",
    "pytest-xdist >= 3",
    "pyyaml >= 5", "cryptography",
]

[project.urls]
"Documentation" = "https://scicatproject.github.io/scitacean"
"Bug Tracker" = "https://github.com/SciCatProject/scitacean/issues"
"Source" = "https://github.com/SciCatProject/scitacean"

[tool.setuptools_scm]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = "tests"
addopts = """
--strict-config
--strict-markers
--disable-socket
--allow-hosts=127.0.0.1,::1
-ra
-v
--hypothesis-profile=scitacean
--dist loadgroup
"""
filterwarnings = [
    "error",
    # Many tests don't set a checksum, so File raises this warning.
    "ignore:Cannot check if local file:UserWarning",
    # From paramiko
    "ignore:TripleDES has been moved:cryptography.utils.CryptographyDeprecationWarning",
]

[tool.mypy]
plugins = "pydantic.mypy"
mypy_path = "src"
exclude = ["docs/conf.py", "venv"]
ignore_missing_imports = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
strict = true
show_error_codes = true
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 88
extend-include = ["*.ipynb"]
extend-exclude = [".*", "__pycache__", "build", "dist", "venv"]

[tool.ruff.lint]
select = ["B", "C4", "D", "DTZ", "E", "F", "G", "I", "FBT003", "FURB", "PERF", "PGH", "PT", "PYI", "RUF", "S", "T20", "UP", "W"]
ignore = [
    "D105", # most magic methods don't need docstrings as their purpose is always the same
    "E741", "E742", "E743", # do not use names ‘l’, ‘O’, or ‘I’; they are not a problem with a proper font
    # Conflict with ruff format, see
    # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "COM812", "COM819", "D206", "D300", "E111", "E114", "E117", "ISC001", "ISC002", "Q000", "Q001", "Q002", "Q003", "W191",
]
fixable = ["B010", "I001", "PT001", "RUF022"]
isort.known-first-party = ["scitacean"]
pydocstyle.convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # asserts are fine in tests
    "D10", # no docstrings required in tests
    "S324", # insecure hsh function; we don't use hashing for security
]
"docs/*" = [
    "D", "E402", "F811", "F841", "RUF015", "S101", "T201",
]
"*.ipynb" = ["I"]
"docs/conf.py" = ["D10"]
"tools/*" = ["D10"]
"src/scitacean/model.py" = ["D10"]
"src/scitacean/testing/strategies.py" = ["D401"]

[tool.typos.default.extend-words]
# Use in SciCat docs
Ntegrity = "Ntegrity"

[tool.typos.default.extend-identifiers]
# typos things it should be 'ser' -> 'set'
plain_serializer_function_ser_schema = "plain_serializer_function_ser_schema"

########
# Pixi #
########

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
scitacean = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["py311"], solve-group = "default" }
dev = { features = ["dev", "py311"], solve-group = "default" }
docs = { features = ["docs", "py311"], solve-group = "default" }
test = { features = ["test", "py311"], solve-group = "default" }

build = { features = ["build", "py311"], solve-group = "build" }

test-py311 = { features = ["test", "py311"], solve-group = "py311" }
test-py312 = { features = ["test", "py312"], solve-group = "py312" }
test-py313 = { features = ["test", "py313"], solve-group = "py313" }
test-py314 = { features = ["test", "py314"], solve-group = "py314" }
test-py315 = { features = ["test", "py315"], solve-group = "py315" }

# --- Python versions ---

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.py315.dependencies]
python = "3.15.*"

# --- Tests ---

[tool.pixi.feature.test.tasks.test]
cmd = "python -m pytest"
default-environment = "test"
description = "Run tests that do not require expensive resources"

[tool.pixi.feature.test.tasks.test-all]
cmd = "python -m pytest --backend-tests --sftp-tests"
default-environment = "test"
description = "Run all tests"

# --- Docs ---

[tool.pixi.feature.docs.tasks.docs]
cmd = "python -m sphinx -v -b html -d build/.doctrees docs html && touch html/.nojekyll && find html -type f -name '*.ipynb' -not -path 'html/_sources/*' -delete"
description = "Build the documentation"

[tool.pixi.feature.docs.tasks.docs-test]
cmd = "python -m sphinx -v -b doctest -d build/.doctrees docs html"
description = "Test the docs with doctest"

[tool.pixi.feature.docs.tasks.docs-links]
cmd = "python -m sphinx -v -b linkcheck -d build/.doctrees docs html"
description = "Check links in the docs"

[tool.pixi.feature.docs.tasks.docs-all]
depends-on = ["docs", "docs-test", "docs-links"]
description = "Build and test the docs"

[tool.pixi.feature.docs.tasks.docs-clean]
cmd = "rm -rf docs/generated build/.doctrees html"
description = "Remove all docs output and intermediate files"

# --- Linting ---

[tool.pixi.feature.dev.tasks.lint]
depends-on = ["lint-py", "spell"]
description = "Run all fast linters; requires `prek`"

[tool.pixi.feature.dev.tasks.lint-py]
cmd = "prek run ruff -a"
description = "Lint Python code; requiures `prek`"

[tool.pixi.feature.dev.tasks.mypy]
cmd = "python -m mypy {{ path }}"
args = [
    { "arg" = "path", "default" = "." }
]
description = "Check types with mypy"

[tool.pixi.feature.dev.tasks.spell]
cmd = "prek run typos -a"
description = "Check spelling; requires `prek`"

# --- Formatting ---

[tool.pixi.feature.dev.tasks.fmt-py]
cmd = "prek run ruff-format -a"
description = "Format Python code; requires `prek`"

[tool.pixi.feature.dev.tasks.fmt-md]
cmd = "prek run mdformat -a"
description = "Format Markdown; requires `prek`"

[tool.pixi.feature.dev.tasks.fmt]
cmd = "prek run ruff-format mdformat -a"
description = "Run all formatters; requires `prek`"

# --- Building ---
[tool.pixi.feature.build.tasks.build]
cmd = "python -m build"
