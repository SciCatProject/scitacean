name: Test

on:
  workflow_dispatch:
    inputs:
      os-variant:
        default: 'ubuntu-24.04'
        type: string
        description: 'Operating system'
      python-version:
        type: string
        description: 'Python interpreter version'
      command:
        type: string
        description: 'Test command to run'
      checkout-ref:
        default: ''
        type: string
        description: 'Git ref to checkout'
      backend-version:
        default: ''
        type: string
        description: 'SciCat backend version, e.g., "v4.8.0"'
  workflow_call:
    inputs:
      os-variant:
        default: 'ubuntu-24.04'
        type: string
      python-version:
        type: string
      command:
        default: 'test'
        type: string
      checkout-ref:
        default: ''
        type: string
      backend-version:
        default: ''
        type: string

jobs:
  tests:
    name: Tests ${{ inputs.os-variant }} ${{ inputs.command }}
    runs-on: ${{ inputs.os-variant }}
    steps:
      - run: sudo apt install --yes docker-compose
        if: ${{ contains(inputs.os-variant, 'ubuntu') }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref }}
      - name: Compute pixi environment
        id: pixi-env
        shell: bash
        # Turn, e.g., '3.14' into 'test-py314'
        run: |
          PYVER="${{ inputs.python-version }}"
          echo "name=test-py${PYVER//./}" >> "$GITHUB_OUTPUT"
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.1
          environments: ${{ steps.pixi-env.outputs.name }}
          frozen: true
      - run: pixi run -e ${{ steps.pixi-env.outputs.name }} ${{ inputs.command }}
        if: ${{ !inputs.backend-version }}
      - run: pixi run -e ${{ steps.pixi-env.outputs.name }} ${{ inputs.command }} --scitacean-backend-version=${{ inputs.backend-version }}
        if: ${{ inputs.backend-version }}
