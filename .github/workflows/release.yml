name: Release

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Wheels
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # history required so setuptools_scm can determine version

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.1
          environments: build
          frozen: true

      - name: Build wheels
        run: pixi run build

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  upload_packages:
    name: Deploy packages
    needs: [ build_wheels ]
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://pypi.org/p/scitacean/
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - uses: actions/download-artifact@v4
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          attestations: true

  docs:
    needs: upload_packages
    uses: ./.github/workflows/docs.yml
    with:
      publish: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    permissions:
      pages: write
      id-token: write
    secrets: inherit
