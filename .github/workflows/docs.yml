name: Docs

on:
  workflow_dispatch:
    inputs:
      publish:
        default: false
        description: Publish docs
        required: false
        type: boolean
  workflow_call:
    inputs:
      publish:
        default: false
        required: false
        type: boolean

jobs:
  build-docs:
    name: Build documentation
    runs-on: ubuntu-24.04
    steps:
      - run: sudo apt install --yes pandoc
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.0
          environments: docs
          frozen: true
      - name: Build and test docs
        run: pixi run docs-all
      - uses: actions/upload-pages-artifact@v3
        name: Upload documentation as artifact
        with:
          name: documentation
          path: html/

  deploy-docs:
    name: Deploy documentation
    needs: build-docs
    if: ${{ inputs.publish }}
    runs-on: ubuntu-slim
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: documentation
