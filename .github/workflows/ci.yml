name: CI

on:
  push:
    branches:
      - main
      - release
  pull_request:

jobs:
  formatting:
    name: Formatting and static analysis
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Install Just
        uses: extractions/setup-just@v4
      - name: Install prek
        run: uv tool install prek
      - run: prek run -a

  type-checking:
    name: Type checking
    needs: formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Install Just
        uses: extractions/setup-just@v4
      - run: just mypy

  tests:
    name: Tests
    needs: formatting
    strategy:
      matrix:
        include:
          - { python: '3.14', os: ubuntu-24.04, command: test-all }
          - { python: '3.13', os: ubuntu-24.04, command: test-all }
          - { python: '3.12', os: ubuntu-24.04, command: test-all }
          - { python: '3.11', os: ubuntu-24.04, command: test-all }
          - { python: '3.11', os: macos-14, command: test }
          - { python: '3.11', os: windows-2022, command: test }
    uses: ./.github/workflows/test.yml
    with:
      os-variant: ${{ matrix.os }}
      python-version: ${{ matrix.python }}
      command: ${{ matrix.command }}
    secrets: inherit

  docs:
    needs: tests
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
