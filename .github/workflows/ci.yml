name: CI

on:
  push:
    branches:
      - main
      - release
  pull_request:

jobs:
  formatting:
    name: Formatting and static analysis
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.1
          environments: dev
          frozen: true
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        name: Run prek

  type-checking:
    name: Type checking
    needs: formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.1
          environments: dev
          frozen: true
      - run: pixi run mypy

  tests:
    name: Tests
    needs: formatting
    strategy:
      matrix:
        include:
          - { python: '3.15', os: ubuntu-24.04, command: test-all }
          - { python: '3.11', os: ubuntu-24.04, command: test-all }
          - { python: '3.11', os: macos-14, command: test }
          - { python: '3.11', os: windows-2022, command: test }
    uses: ./.github/workflows/test.yml
    with:
      os-variant: ${{ matrix.os }}
      python-version: ${{ matrix.python }}
      command: ${{ matrix.command }}
    secrets: inherit

  docs:
    needs: tests
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
