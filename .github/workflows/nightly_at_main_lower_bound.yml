name: Nightly using lower bound dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 1-5'

jobs:
  tests:
    name: Tests at lower bound
    runs-on: 'ubuntu-24.04'
    steps:
      - run: sudo apt install --yes docker-compose
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Run Tests
        # This is not possible with pixi, so use uv.
        run: uv run --resolution=lowest-direct --group=test --group=sftp pytest --backend-tests --sftp-tests
